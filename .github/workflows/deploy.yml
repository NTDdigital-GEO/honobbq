# ═══════════════════════════════════════════════════════════════
#  自動建置、檢查並發布網站到 GitHub Pages
#
#  什麼時候會跑：push 到 main（包含在 GitHub 網頁上直接改檔案並 Commit），
#                或在 Actions 頁面手動按 Run workflow。
#
#  會做的事：
#    1. 用 Python 產出網站（build.py）
#    2. 兩道檢查，沒過就中止，壞掉的網站不會上線：
#         validate.py    失效連結、H1、schema、FAQ 一致性、NAP、圖片、JS 語法、表單把關
#         check_copy.py  稽核抓到的錯字眼（Honō／75052／soft opening／best…）
#    3. 發布到 GitHub Pages
#
#  ── 目前是「預覽階段」────────────────────────────────────────
#  NOINDEX=1：擋住 Google，只給客戶和同事看。
#  網址是 https://<帳號>.github.io/<repo名稱>/
#
#  ── 正式上線（換到 honobbq.com）時要改這 4 行，見 README 第 5 步 ──
#    SITE_URL=https://www.honobbq.com    （寫死，不要用 steps.pages 的輸出值）
#    BASE_PATH=                          （留空）
#    NOINDEX=0
#    CNAME_DOMAIN=www.honobbq.com
#  build.py 會擋下「NOINDEX=0 但沒設 SITE_URL」的情況；
#  validate.py 會擋下「NOINDEX=0 但表單收件信箱沒確認」的情況。
# ═══════════════════════════════════════════════════════════════
name: 建置並發布網站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 設定 Pages（第一次會自動開啟 Pages）
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 準備建置參數（預覽階段）
        run: |
          echo "SITE_URL=${{ steps.pages.outputs.origin }}"     >> "$GITHUB_ENV"
          echo "BASE_PATH=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
          echo "NOINDEX=1"                                      >> "$GITHUB_ENV"

      - name: 產出網站
        env:
          FORM_ACCESS_KEY: ${{ secrets.FORM_ACCESS_KEY }}   # Settings → Secrets → Actions；沒設定時表單只顯示提示、不會送出
          GTM_ID: ${{ vars.GTM_ID }}                         # Settings → Variables → Actions；建好 GTM 容器後再填
        run: python3 build.py

      - name: 檢查網站有沒有問題
        env:
          FORM_ACCESS_KEY: ${{ secrets.FORM_ACCESS_KEY }}
          FORM_RECIPIENT_CONFIRMED: ${{ vars.FORM_RECIPIENT_CONFIRMED }}   # 測試信確認寄到客戶信箱後，設成 1
        run: |
          python3 validate.py
          python3 check_copy.py

      - name: 上傳產出
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 發布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
